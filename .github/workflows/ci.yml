name: CI

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Worker dependencies
        run: npm ci --prefix workers/meal-parser

      - name: Setup Java for local Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Firebase emulator CLI
        run: npm install --global firebase-tools@15.2.1

      - name: Run application, Worker and demo storage tests
        run: npm run test:voice-photo

      - name: Server, consent and adapter tests
        run: npm run test:server && npm run test:rules && npm run test:phone-lab

      - name: Install pinned browser
        run: npx playwright install chromium

      - name: Browser flows on isolated demo accounts
        run: npm run test:trainer-ui && npm run test:voice-photo-ui && npm run test:phone-lab-ui

      - name: Keep synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            tmp/trainer-ui-qa/
            tmp/voice-photo-qa/
            tmp/phone-lab-qa/evidence.json
          retention-days: 7

      - name: Build app
        run: npm run build
