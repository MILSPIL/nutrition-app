name: CI

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Worker dependencies
        run: npm ci --prefix workers/meal-parser

      - name: Setup Java for local Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Firebase emulator CLI
        run: npm install --global firebase-tools@15.2.1

      - name: Run application, Worker and demo storage tests
        run: npm run test:voice-photo

      - name: Server, consent and adapter tests
        run: npm run test:server && npm run test:rules && npm run test:phone-lab && npm run test:hermes-store

      - name: Install pinned browser
        run: npx playwright install chromium

      - name: Browser flows on isolated demo accounts
        run: npm run test:trainer-ui && npm run test:voice-photo-ui && npm run test:phone-lab-ui && node scripts/phone-lab-ui.mjs --stt-only && npm run test:hermes-ui && npm run test:coach-ui

      - name: Keep synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            tmp/trainer-ui-qa/
            tmp/voice-photo-qa/
            tmp/phone-lab-qa/evidence.json
            tmp/phone-lab-stt-only-qa/evidence.json
            tmp/hermes-chat-qa/
            tmp/coach-ui-qa/
          retention-days: 7

      - name: Build exact committed app with trainer disabled
        run: npm run build:hermes-off

  groq-free-resource-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Node API fixture image
        run: docker build --file server/groq.Dockerfile --tag scisense-groq-free-check .
      - name: Verify Groq adapter on 1 CPU and 2 GiB without network or credentials
        run: docker run --rm --network=none --cpus=1 --memory=2g --memory-swap=2g --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m scisense-groq-free-check

  systemd-credential-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Exercise actual systemd unit with synthetic encrypted credentials
        run: node server/linux/run-systemd.mjs
      - name: Keep synthetic systemd evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemd-evidence
          path: tmp/systemd-check/evidence.json
          retention-days: 7

  hermes-resource-check:
    # Ubuntu 24 host AppArmor restricts unprivileged userns even in unconfined containers.
    # Keep the pinned Ubuntu24 payload; no runner sysctl or extra capability is changed.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Hermes and public food index without credentials
        run: docker build --file server/trainer/hermes.Dockerfile --tag scisense-hermes-ci .
      - name: Prove child isolation and negative controls without provider requests
        run: docker run --rm --init --network=none --cpus=2 --memory=2g --memory-swap=2g --pids-limit=128 --cap-drop=ALL --security-opt=no-new-privileges --security-opt=seccomp=unconfined --security-opt=apparmor=unconfined --security-opt=systempaths=unconfined --entrypoint node scisense-hermes-ci scripts/hermes-linux-isolation-test.mjs
      - name: Actual Hermes plus Node in a shared 2 CPU / 2 GiB cgroup
        # Nested unprivileged user namespaces require the synthetic container's
        # namespace and /proc setup allowances. Child BPF remains enforced.
        # No host mount, socket, key, capability or network; container UID10001.
        run: |
          docker run --name hermes-resource --init --network=none --cpus=2 --memory=2g --memory-swap=2g --pids-limit=128 --cap-drop=ALL --security-opt=no-new-privileges --security-opt=seccomp=unconfined --security-opt=apparmor=unconfined --security-opt=systempaths=unconfined --entrypoint timeout scisense-hermes-ci --signal=TERM --kill-after=5s 45s node scripts/hermes-gateway-test.mjs --resource-probe --capacity-probe
      - name: Collect resource evidence
        if: always()
        run: |
          mkdir -p tmp/hermes-linux
          docker cp hermes-resource:/app/.agents/runtime/hermes-lab/capacity-summary.json tmp/hermes-linux/capacity-summary.json || true
          docker inspect hermes-resource --format '{{json .State}}' > tmp/hermes-linux/container-state.json || true
          if docker ps -a --filter name=^/hermes-resource$ --format '{{.ID}}' | grep -q .; then docker rm -f hermes-resource; fi
          test -z "$(docker ps -a --filter name=^/hermes-resource$ --format '{{.ID}}')"
          printf '{"removed":true}\n' > tmp/hermes-linux/cleanup.json
          test -s tmp/hermes-linux/capacity-summary.json
      - name: Native recovery and failure cases with the same resource limits
        run: docker run --rm --init --network=none --cpus=2 --memory=2g --memory-swap=2g --pids-limit=128 --cap-drop=ALL --security-opt=no-new-privileges --security-opt=seccomp=unconfined --security-opt=apparmor=unconfined --security-opt=systempaths=unconfined scisense-hermes-ci
      - name: Complete a repaired draft within three provider calls
        run: docker run --rm --init --network=none --cpus=2 --memory=2g --memory-swap=2g --pids-limit=128 --cap-drop=ALL --security-opt=no-new-privileges --security-opt=seccomp=unconfined --security-opt=apparmor=unconfined --security-opt=systempaths=unconfined --entrypoint timeout scisense-hermes-ci --signal=TERM --kill-after=5s 45s node scripts/hermes-gateway-test.mjs --repair-probe
      - name: Prove the candidate systemd unit with the same resource limits
        run: node scripts/hermes-systemd-ci.mjs
      - name: Actual personal Hermes profiles with photo replay under the same hard limits
        run: node scripts/hermes-personal-native-systemd-ci.mjs
      - name: Export verified public Linux runtime without state or credentials
        run: |
          docker run --name hermes-export --network=none --entrypoint python3 scisense-hermes-ci scripts/hermes-runtime-export.py
          mkdir -p tmp/hermes-runtime
          docker cp hermes-export:/tmp/hermes-public-runtime/. tmp/hermes-runtime/
          docker rm hermes-export
          test -z "$(docker ps -a --filter name=^/hermes-export$ --format '{{.ID}}')"
      - name: Keep disabled public runtime payload
        uses: actions/upload-artifact@v4
        with:
          name: hermes-public-runtime
          path: tmp/hermes-runtime/
          compression-level: 0
          retention-days: 7
      - name: Keep synthetic Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-linux-evidence
          path: tmp/hermes-linux/
          retention-days: 7
