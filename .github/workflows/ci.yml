name: CI

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Worker dependencies
        run: npm ci --prefix workers/meal-parser

      - name: Setup Java for local Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Firebase emulator CLI
        run: npm install --global firebase-tools@15.2.1

      - name: Run application, Worker and demo storage tests
        run: npm run test:voice-photo

      - name: Build app
        run: npm run build
