name: CI

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Worker dependencies
        run: npm ci --prefix workers/meal-parser

      - name: Setup Java for local Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Firebase emulator CLI
        run: npm install --global firebase-tools@15.2.1

      - name: Run application, Worker and demo storage tests
        run: npm run test:voice-photo

      - name: Server, consent and adapter tests
        run: npm run test:server && npm run test:rules && npm run test:phone-lab && npm run test:hermes-store

      - name: Install pinned browser
        run: npx playwright install chromium

      - name: Browser flows on isolated demo accounts
        run: npm run test:trainer-ui && npm run test:voice-photo-ui && npm run test:phone-lab-ui && node scripts/phone-lab-ui.mjs --stt-only && npm run test:hermes-ui

      - name: Keep synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            tmp/trainer-ui-qa/
            tmp/voice-photo-qa/
            tmp/phone-lab-qa/evidence.json
            tmp/phone-lab-stt-only-qa/evidence.json
            tmp/hermes-chat-qa/evidence.json
          retention-days: 7

      - name: Build app
        run: npm run build

  groq-free-resource-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Node API fixture image
        run: docker build --file server/groq.Dockerfile --tag scisense-groq-free-check .
      - name: Verify Groq adapter on 1 CPU and 2 GiB without network or credentials
        run: docker run --rm --network=none --cpus=1 --memory=2g --memory-swap=2g --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m scisense-groq-free-check

  systemd-credential-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Exercise actual systemd unit with synthetic encrypted credentials
        run: node server/linux/run-systemd.mjs
      - name: Keep synthetic systemd evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemd-evidence
          path: tmp/systemd-check/evidence.json
          retention-days: 7

  hermes-resource-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Hermes and public food index without credentials
        run: docker build --file server/trainer/hermes.Dockerfile --tag scisense-hermes-ci .
      - name: Prove child isolation and negative controls without provider requests
        run: docker run --rm --init --network=none --cpus=2 --memory=2g --memory-swap=2g --pids-limit=128 --cap-drop=ALL --security-opt=no-new-privileges --security-opt=seccomp=unconfined --security-opt=apparmor=unconfined --entrypoint node scisense-hermes-ci scripts/hermes-linux-isolation-test.mjs
      - name: Actual Hermes plus Node in a shared 2 CPU / 2 GiB cgroup
        # Nested unprivileged user namespaces require the synthetic container's
        # seccomp allowance. No host mount, socket, key, capability or network.
        run: |
          docker run --name hermes-resource --init --network=none --cpus=2 --memory=2g --memory-swap=2g --pids-limit=128 --cap-drop=ALL --security-opt=no-new-privileges --security-opt=seccomp=unconfined --security-opt=apparmor=unconfined --entrypoint timeout scisense-hermes-ci --signal=TERM --kill-after=5s 45s node scripts/hermes-gateway-test.mjs --resource-probe
      - name: Collect resource evidence
        if: always()
        run: |
          mkdir -p tmp/hermes-linux
          docker cp hermes-resource:/app/.agents/runtime/hermes-lab/resource-summary.json tmp/hermes-linux/resource-summary.json || true
          docker inspect hermes-resource --format '{{json .State}}' > tmp/hermes-linux/container-state.json || true
          docker rm -f hermes-resource || true
      - name: Native recovery and failure cases with the same resource limits
        run: docker run --rm --init --network=none --cpus=2 --memory=2g --memory-swap=2g --pids-limit=128 --cap-drop=ALL --security-opt=no-new-privileges --security-opt=seccomp=unconfined --security-opt=apparmor=unconfined scisense-hermes-ci
      - name: Keep synthetic Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-linux-evidence
          path: tmp/hermes-linux/
          retention-days: 7
